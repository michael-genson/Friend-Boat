[project]
name = "friend_boat"
version = "1.4.9"
description = "A simple music bot for Discord"
authors = [
    { name = "Michael Genson", email = "71845777+michael-genson@users.noreply.github.com" },
]
license = "GNU"
requires-python = ">=3.12,<3.13"
dependencies = [
    "py-cord[voice]==2.8.1",
    "pydantic-settings==2.16.2",
    "pynacl==1.6.2",
    "python-youtube==0.9.9",
    "slash-cog==0.0.3",
    "yt-dlp==2026.10.26",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
]

[tool.isort]
line_length = 120

[tool.ruff]
extend-exclude = ["deploy/*", "tests/*"]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
ignore = ["BLE001", "LOG015", "S110", "TRY002"]  # TODO: resolve these so we don't have to ignore them

[tool.bumpversion]
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
